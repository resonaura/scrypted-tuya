name: "Tuya RTSP Bridge"
version: "1.2.9"
slug: bridge
description: "Turn Tuya / Smart Life cameras into plain RTSP for Frigate, go2rtc, Agent DVR."
url: "https://github.com/resonaura/scrypted-tuya"
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: application
boot: auto
host_network: true
ports:
  8787/tcp: 8787
  8600/tcp: 8600
ports_description:
  8787/tcp: Web UI / API (Create QR, camera list)
  8600/tcp: RTSP for NVR clients
map:
  - addon_config:rw
  - data:rw
options: {}
schema: {}
panel_icon: mdi:cctv
panel_title: Tuya RTSP
webui: "http://[HOST]:[PORT:8787]"
homeassistant_api: false
hassio_api: false
apparmor: true
