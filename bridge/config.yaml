name: "Tuya Camera Bridge"
slug: "tuya_rtsp_bridge"
description: "Full-stack Tuya & Smart Life camera P2P/WebRTC-to-RTSP bridge with live Web UI and Scrypted integration"
version: "2.0.2"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: services
boot: auto
host_network: true
apparmor: true
webui: "http://[HOST]:[PORT:6767]"
map:
  - config:rw
  - share:rw
options:
  api_port: 6766
  web_port: 6767
  rtsp_port: 8655
  log_level: "info"
schema:
  api_port: port?
  web_port: port?
  rtsp_port: port?
  log_level: list(debug|info|warn|error)?
