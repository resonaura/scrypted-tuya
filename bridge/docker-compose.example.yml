services:
  tuya-bridge:
    image: ghcr.io/resonaura/tuya-rtsp-bridge:latest
    # Or build locally from source:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: tuya-bridge
    restart: unless-stopped
    # CRITICAL: host network mode is required for camera P2P WebRTC / UDP discovery
    network_mode: host
    environment:
      - PORT=6766
      - WEB_PORT=6767
      - RTSP_BASE_PORT=8655
      # Optional: set your LAN host IP explicitly if auto-detection fails:
      # - RTSP_HOST=192.168.1.50
      - LOG_LEVEL=info
    volumes:
      - ./data:/data/tuya-bridge
      - ./config:/config/tuya-bridge
