name: "Tuya RTSP & P2P Camera Bridge"
slug: "tuya_rtsp_bridge"
description: "High-performance Tuya & Smart Life Camera RTSP Bridge with live P2P streaming and Web UI"
version: "1.0.0"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: services
boot: auto
host_network: true
apparmor: true
ingress: true
ingress_port: 6767
map:
  - config:rw
  - share:rw
options:
  api_port: 6766
  web_port: 6767
  rtsp_port: 8655
  log_level: "info"
schema:
  api_port: port?
  web_port: port?
  rtsp_port: port?
  log_level: list(debug|info|warn|error)?
