packages:
  - 'apps/*'

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: true

overrides:
  '@nestjs/platform-fastify': '^11.2.11'
  fastify: '^5.12.8'
  '@fastify/static': '^10.1.12'
  'fast-uri@>=3.0.0 <3.1.9': '^3.1.9'
  'fast-uri@>=4.0.0 <4.1.5': '^4.1.5'
  'brace-expansion@<1.1.20': '^1.1.22'
  'brace-expansion@>=2.0.0 <2.1.6': '^2.1.8'
  'brace-expansion@>=4.0.0 <5.0.11': '^5.0.13'
  source-map-js: '>=1.2.2'
  compression: '>=1.8.2'
  follow-redirects: '>=1.16.2'
